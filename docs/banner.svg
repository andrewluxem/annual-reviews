<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
<title id="t">annual-reviews</title>
<desc id="d">Three panels from the skill's worked example in SKILL.md, not a recorded run. 1, the request: Draft this annual review. Jordan delivered four of five planned milestones, helped onboard two teammates, and needs to communicate schedule risks earlier. I do not have the dates for the risk examples or our rating rubric handy. 2, the rule: classify each material detail as supplied evidence, attributed feedback, self-reflection, inference, or missing, and never invent an incident, date, metric, quote, result, or peer view. 3, the draft writes Incident date and impact needed and does not assign a rating; the template's rating boundary: No rating recommendation or populated rating. Authorized reviewer decision required.</desc>
<style>
.serif{font-family:Georgia,"Times New Roman",serif}
.sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.lab{font-size:10px;letter-spacing:1.8px;font-weight:600}
.cap{font-size:11.5px;fill:#8b9096}
.hl{fill:none;stroke-width:1.5;opacity:0}
.h1{animation:h1 12s infinite}
.h2{animation:h2 12s infinite}
.h3{animation:h3 12s infinite}
.r1{animation:r1 12s infinite}
.r2{animation:r2 12s infinite}
.rb{animation:rb 12s infinite}
.rc{animation:rc 12s infinite}
.rd{animation:rd 12s infinite}
.re{animation:re 12s infinite}
.rf{animation:rf 12s infinite}
@keyframes h1{0%,16.7%{opacity:0}18.7%,42.4%{opacity:1}44.1%,100%{opacity:0}}
@keyframes h2{0%,16.7%,18.7%,44.1%{opacity:0}45.8%,67.8%{opacity:1}69.5%,100%{opacity:0}}
@keyframes h3{0%,16.7%,18.7%,69.5%{opacity:0}71.2%,94.9%{opacity:1}96.6%,100%{opacity:0}}
@keyframes r1{0%,16.7%{opacity:1}18.7%,20.4%{opacity:0}22.1%,100%{opacity:1}}
@keyframes r2{0%,16.7%{opacity:1}18.7%,32.2%{opacity:0}33.9%,100%{opacity:1}}
@keyframes rb{0%,16.7%{opacity:1}18.7%,45%{opacity:0}46.6%,100%{opacity:1}}
@keyframes rc{0%,16.7%{opacity:1}18.7%,56%{opacity:0}57.7%,100%{opacity:1}}
@keyframes rd{0%,16.7%{opacity:1}18.7%,72.1%{opacity:0}73.7%,100%{opacity:1}}
@keyframes re{0%,16.7%{opacity:1}18.7%,78.8%{opacity:0}80.5%,100%{opacity:1}}
@keyframes rf{0%,16.7%{opacity:1}18.7%,85.6%{opacity:0}87.3%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="300" fill="#141618"/>

<text x="32" y="50" class="serif" font-size="28" fill="#e4dfd4">annual-reviews</text>
<text x="238" y="50" class="sans" font-size="13.5" fill="#a9adb2">Static agent skill for manager reviews, self-reviews, and evidence audits</text>

<g>
<text x="32" y="88" class="sans lab" fill="#a39bbd">1 · NOTES WITH A GAP</text>
<rect x="32" y="98" width="252" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h1" x="32" y="98" width="252" height="152" rx="3" stroke="#a39bbd"/>
<text x="44" y="115" class="mono" font-size="10" fill="#8b9096">SKILL.md · worked example</text>
<line x1="33" y1="123" x2="283" y2="123" stroke="#2e3237"/>
<g class="r1"><text x="44" y="143" class="sans" font-size="10.5" fill="#e4dfd4">Draft this annual review. Jordan</text><text x="44" y="158" class="sans" font-size="10.5" fill="#e4dfd4">delivered four of five planned milestones,</text><text x="44" y="173" class="sans" font-size="10.5" fill="#e4dfd4">helped onboard two teammates, and needs</text><text x="44" y="188" class="sans" font-size="10.5" fill="#e4dfd4">to communicate schedule risks earlier.</text><text x="44" y="203" class="sans" font-size="10.5" fill="#e4dfd4">I do not have the dates for the risk</text><text x="44" y="218" class="sans" font-size="10.5" fill="#e4dfd4">examples or our rating rubric handy.</text></g>
<rect class="r2" x="40" y="192.5" width="176" height="30.5" fill="none" stroke="#c8963e" stroke-dasharray="3 2"/>
<text x="32" y="272" class="sans cap">A growth area with no dates behind it.</text>
</g>

<g>
<text x="304" y="88" class="sans lab" fill="#c8963e">2 · EVIDENCE OR A SLOT</text>
<rect x="304" y="98" width="254" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h2" x="304" y="98" width="254" height="152" rx="3" stroke="#c8963e"/>
<text x="316" y="115" class="mono" font-size="10" fill="#8b9096">SKILL.md</text>
<line x1="305" y1="123" x2="557" y2="123" stroke="#2e3237"/>
<g class="rb"><text x="316" y="143" class="sans" font-size="10.5" fill="#e4dfd4">Classify each material detail as</text><text x="316" y="157" class="sans" font-size="10.5" fill="#e4dfd4">supplied evidence, attributed feedback,</text><text x="316" y="171" class="sans" font-size="10.5" fill="#e4dfd4">self-reflection, inference, or <tspan fill="#c8963e" font-weight="700">missing.</tspan></text></g>
<g class="rc"><line x1="316" y1="184.5" x2="546" y2="184.5" stroke="#2e3237"/><text x="316" y="203" class="sans" font-size="10.5" fill="#e4dfd4">Never invent an incident, date, metric,</text><text x="316" y="217" class="sans" font-size="10.5" fill="#e4dfd4">quote, result, or peer view.</text></g>
<text x="304" y="272" class="sans cap">Each detail is sourced or marked missing.</text>
</g>

<g>
<text x="578" y="88" class="sans lab" fill="#93ad8c">3 · THE GAP STAYS VISIBLE</text>
<rect x="578" y="98" width="290" height="152" rx="3" fill="#1b1e21" stroke="#2e3237"/>
<rect class="hl h3" x="578" y="98" width="290" height="152" rx="3" stroke="#93ad8c"/>
<text x="590" y="115" class="mono" font-size="10" fill="#8b9096">SKILL.md · worked example</text>
<line x1="579" y1="123" x2="867" y2="123" stroke="#2e3237"/>
<g class="rd"><text x="594" y="146" class="mono" font-size="10" fill="#93ad8c">Incident date and impact needed</text><rect x="588" y="134.5" width="199" height="16" fill="none" stroke="#93ad8c" stroke-dasharray="3 2"/></g>
<g class="re"><text x="590" y="170" class="sans" font-size="10.5" fill="#e4dfd4">It does not assign a rating.</text></g>
<g class="rf"><line x1="590" y1="182.5" x2="856" y2="182.5" stroke="#2e3237"/><text x="590" y="199" class="mono" font-size="10" fill="#8b9096">assets/manager-review-template.md</text><text x="590" y="215" class="mono" font-size="10" fill="#e4dfd4">Rating boundary: No rating recommendation</text><text x="590" y="229" class="mono" font-size="10" fill="#e4dfd4">or populated rating. Authorized reviewer</text><text x="590" y="243" class="mono" font-size="10" fill="#e4dfd4">decision required.</text></g>
<text x="578" y="272" class="sans" font-size="11.5" fill="#93ad8c">The gap stays in the draft. No rating.</text>
</g>
</svg>
